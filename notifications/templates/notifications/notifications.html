{% extends 'base.html' %}

{% block title %}Notifications - Veyra{% endblock %}

{% block extra_css %}
<style>
    .notifications-page { min-height: 100vh; padding: 44px 0 80px; background: #f7f5f0; }
    .notifications-shell { width: min(920px, calc(100% - 32px)); margin: 0 auto; }
    .notifications-head { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 26px; }.notifications-head h1 { margin: 0; color: var(--ink); font-size: clamp(2.5rem, 6vw, 4.6rem); line-height: .95; }.notifications-head p { margin: 12px 0 0; color: var(--muted); }
    .mark-all-button { min-height: 42px; border: 1px solid var(--line); border-radius: var(--radius); padding: 0 15px; color: var(--ink); background: #fff; font: inherit; font-size: .84rem; font-weight: 850; cursor: pointer; }.mark-all-button:hover { border-color: var(--ink); }
    .notifications-card { overflow: hidden; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; box-shadow: 0 16px 36px rgba(17,24,39,.05); }
    .notification-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 16px 20px; border-bottom: 1px solid var(--line); }.filter-tabs { display: flex; gap: 4px; }.filter-tab { border: 0; border-radius: 6px; padding: 8px 10px; color: var(--muted); background: transparent; font: inherit; font-size: .82rem; font-weight: 850; cursor: pointer; }.filter-tab.is-active { color: var(--ink); background: #f1f4f8; }.unread-count { color: var(--muted); font-size: .8rem; font-weight: 750; }.unread-count strong { color: var(--accent); }
    .notification-list { display: grid; }.notification { position: relative; display: grid; grid-template-columns: 42px minmax(0,1fr) auto; align-items: start; gap: 14px; padding: 18px 20px; border-bottom: 1px solid #edf0f3; }.notification:last-child { border-bottom: 0; }.notification.is-unread { background: #fbfcff; }.notification.is-unread::before { position: absolute; top: 25px; left: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); content: ''; }.notification-icon { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 50%; color: var(--accent); background: var(--accent-soft); font-size: 1.05rem; font-weight: 900; }.notification-icon.delivery { color: #155eef; background: #eff4ff; }.notification-icon.account { color: #087443; background: #ecfdf3; }.notification-copy h2 { margin: 1px 0 5px; color: var(--ink); font-size: .94rem; }.notification-copy p { margin: 0; color: var(--muted); font-size: .84rem; line-height: 1.5; }.notification-copy a { color: var(--accent); font-weight: 800; text-decoration: none; }.notification-time { padding-top: 3px; color: #98a2b3; font-size: .75rem; white-space: nowrap; }.mark-read { align-self: center; border: 0; padding: 5px; color: #98a2b3; background: transparent; font: inherit; font-size: .75rem; font-weight: 800; cursor: pointer; }.mark-read:hover { color: var(--ink); }.notification:not(.is-unread) .mark-read { display: none; }
    .empty-state { display: none; padding: 62px 24px; text-align: center; }.empty-state h2 { margin: 0; font-size: 1.1rem; }.empty-state p { margin: 8px 0 0; color: var(--muted); font-size: .86rem; }.empty-state.is-visible { display: block; }.notification.is-hidden { display: none; }
    @media (max-width: 620px) { .notifications-page { padding-top: 28px; }.notifications-head { align-items: stretch; flex-direction: column; }.mark-all-button { align-self: flex-start; }.notification-toolbar { align-items: flex-start; flex-direction: column; }.notification { grid-template-columns: 38px minmax(0,1fr); padding: 16px; }.notification-time { grid-column: 2; padding: 0; }.notification-icon { width: 38px; height: 38px; }.mark-read { position: absolute; top: 13px; right: 10px; } }
</style>
{% endblock %}

{% block content %}
<main class="notifications-page">
<div id="noti-shell">
    {% include 'notifications/partial/notification_partial.html' %}
</div>
</main>
{% endblock %}
