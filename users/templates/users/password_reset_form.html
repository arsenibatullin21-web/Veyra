{% extends 'base.html' %}

{% block content %}
<h1>Password Reset</h1>

    <form method="post">
    {% csrf_token %}
    {% for f in form %}
    	<p><label class="newsletter-form" for="{{ f.id_for_label }}">{{ f.label }}: </label>{{ f }}</p>
        <div class="form-error-list">{{ f.errors }}</div>
    {% endfor %}

    <p><button type="submit">Reset by E-mail</button></p>
    </form>
{% endblock %}
