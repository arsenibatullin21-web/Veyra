{% extends 'base.html' %}

{% block content %}
<h1>New Password</h1>
    <form method="post">
    {% csrf_token %}
        <div class="form-error-list">{{ form.non_field_errors }}</div>
    {% for f in form %}
    	<p><label class="newsletter-form" for="{{ f.id_for_label }}">{{ f.label }}: </label>{{ f }}</p>
        <div class="form-error-list">{{ f.errors }}</div>
    {% endfor %}

    <p><button type="submit">Save</button></p>
    </form>
{% endblock %}
